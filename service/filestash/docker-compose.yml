name: filestash

services:
  filestash:
    image: machines/filestash:latest

    container_name: filestash

    user: "${HOMELAB_UID}:${HOMELAB_GID}"

    ports:
      - ${FILESTASH_PORT}:8334

    volumes:
      - ${HOMELAB_DATA_DIR}/apps/filestash/state:/app/data/state
      - ${HOMELAB_DATA_DIR}/${FILESTASH_ROOT_DIR}:/srv/sync

    environment:
      TZ: ${TZ}

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "2", "-o", "/dev/null", "http://127.0.0.1:8334/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1m

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
